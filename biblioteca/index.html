<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de biblioteca</title>
    <link rel="stylesheet" href="estilo.css">
    
</head>
<body>
    
    <h1>BiblioSystem</h1>
  
  <div class="box">
    
        <h2>Gerenciar acervo</h2>
        <p>Utilize as ações abaixo para administrar os livros cadastrados </p>

        <h3>CADASTRO</h3>
        <hr>
        <button onclick="cadastrar()">+Cadastrar novo livro</button>
    
    
        <h3>CONSULTAS</h3>
        <hr>
        <button onclick="quantidade()">Quantidade de livros</button>
        <button onclick="listar()">Listar todos os livros</button>
   
        <h3>REMOCAO</h3>
         <hr>
        <button onclick="removerUltimo()">Remover ultimo livro</button>
        <button onclick ="limpar()">limpar biblioteca</button>
    </div>
</div>
</body>
<script src="script.js"></script>
</html>
